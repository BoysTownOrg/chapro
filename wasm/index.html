<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAPRO WebAssembly Demo</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; line-height: 1.6; }
        .card { padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background-color: #f9f9f9; }
        h1 { color: #333; }
        .status { padding: 0.5rem; background-color: #e0f2f1; color: #00695c; border-radius: 4px; display: inline-block; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <h1>CHAPRO WebAssembly Demo</h1>
    <div class="card">
        <div class="status" id="status">Loading WebAssembly module...</div>
        <p><strong>Library Version:</strong> <span id="version">Unknown</span></p>
        <p>This demo confirms that the CHAPRO C library has been successfully compiled to WebAssembly (Wasm) and is running natively in your browser.</p>
    </div>

    <!-- The Emscripten generated JS file -->
    <script src="chapro.js"></script>
    <script src="app.js"></script>
</body>
</html>
